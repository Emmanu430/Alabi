<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Cuts the two legs flat at the bottom so the A has square feet -->
    <clipPath id="feet">
      <rect width="32" height="27" />
    </clipPath>
  </defs>

  <!-- Tile: your black token -->
  <rect width="32" height="32" fill="#010400" />

  <!-- Crossbar as a teal cursor block (your teal token). Drawn first so the legs sit on top of its ends. -->
  <rect x="10" y="20" width="12" height="4.5" fill="#62bbc1" />

  <!-- The A: two legs meeting at a sharp peak (your snow token) -->
  <g clip-path="url(#feet)">
    <path
      d="M5 34 L16 9 L27 34"
      fill="none"
      stroke="#fffbfc"
      stroke-width="3.2"
      stroke-linejoin="miter"
      stroke-linecap="butt"
    />
  </g>
</svg>
